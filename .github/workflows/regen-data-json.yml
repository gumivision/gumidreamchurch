name: Build data.json and deploy Pages

on:
  # 1) 관리자가 글/이미지를 commit 했을 때 자동 실행
  push:
    branches: [ main ]
    paths:
      - 'posts/**'
      - 'gallery/**'
      - 'images/**'
      - 'index.html'
  # 2) Actions 탭에서 "Run workflow" 로 수동 트리거 가능
  workflow_dispatch:

# 동시 실행 충돌 방지 (data.json 재기록 race 방지)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read      # checkout 용
  pages: write        # GitHub Pages 배포 트리거용
  id-token: write     # OIDC (향후 deploy 시 필요)

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout (전 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build /data.json (posts + gallery 통합)
        run: node scripts/build-data-json.cjs

      - name: Show first 5 lines (디버그용)
        run: head -n 5 data.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # ※ 만약 Pages 소스가 여전히 legacy 라면 deploy 단계가 에러 없이도 Pages 가 안 바뀝니다.
      #   Settings → Pages → Source = "GitHub Actions" 가 먼저 설정되어 있어야 합니다.
