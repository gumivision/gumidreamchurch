content:
backend:
  name: git-gateway
  repo: gumivision/gumidreamchurch
  branch: main

# 커밋 메시지
commit_messages:
  create: "Create {{collection}} “{{slug}}”"
  update: "Update {{collection}} “{{slug}}”"
  delete: "Delete {{collection}} “{{slug}}”"
  uploadMedia: "Upload “{{path}}”"
  deleteMedia: "Delete “{{path}}”"

show_preview_links: false

# ✅ 이미지 저장 위치 = 저장소 루트 /images
media_folder: "images"
public_folder: "/images"

collections:
  # 1. 게시판 글
  - name: "posts"
    label: "게시판 글"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작성일자", name: "date", widget: "datetime" }
      - { label: "대표/첨부 이미지", name: "image", widget: "image", required: false }
      # ✅ 한글 IME 조합 오류 해결: markdown → text 위젯으로 변경
      #    순수 textarea 사용 → "누"를 쳐도 "ㄴㅜ"로 분리되지 않음
      #    본문에 이미지 넣을 땐: ![설명](/images/파일명.jpg)
      #    강조: **굵게**, *기울임*, ## 소제목
      - label: "내용"
        name: "body"
        widget: "text"
        hint: "마크다운 문법 사용 가능. 이미지 넣기: ![설명](/images/파일명.jpg) / 굵게: **텍스트** / 소제목: ## 텍스트"

  # 2. 함께한 순간들 (갤러리)
  - name: "gallery"
    label: "함께한 순간들 (갤러리)"
    folder: "gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "사진 제목", name: "title", widget: "string" }
      - { label: "사진", name: "image", widget: "image" }
      - { label: "촬영/등록 일자", name: "date", widget: "datetime", required: false, default: "" }
