backend:
  name: github
  repo: gumivision/gumidreamchurch
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  # 1. 기존 게시판 글
  - name: "posts"
    label: "게시판 글"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작성일자", name: "date", widget: "datetime" }
      - { label: "대표/첨부 이미지", name: "image", widget: "image", required: false }
      - { label: "내용", name: "body", widget: "markdown" }

  # 2. 함께한 순간들 (갤러리)
  - name: "gallery"
    label: "함께한 순간들 (갤러리)"
    folder: "gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "제목/설명 (선택사항)", name: "title", widget: "string", required: false }
      - { label: "등록일자", name: "date", widget: "datetime" }
      - label: "갤러리 사진 목록 (다중 선택/추가)"
        name: "images"
        widget: "list"
        field: { label: "사진", name: "image", widget: "image" }
