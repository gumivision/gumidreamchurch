backend:
  name: git-gateway
  repo: gumivision/gumidreamchurch
  branch: main

# 정적 이미지 파일 저장 위치
# - 실제 저장 위치: 저장소 루트의 images/ 폴더
# - 마크다운에는 "/images/foo.png" 경로로 기록됨
media_folder: "images"
public_folder: "/images"

# CMS 좌측 표시 이름
display_name: "구미 꿈이 있는 교회 관리"

# 게시판 + 갤러리 두 컬렉션
collections:
  - name: "posts"
    label: "교회 소식"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "대표 이미지", name: "image", widget: "image", required: false }
      - { label: "본문", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "함께한 순간들"
    folder: "gallery"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "이미지", name: "image", widget: "image", required: true }
      - { label: "설명", name: "body", widget: "markdown", required: false }
