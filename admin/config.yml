
Backend:
  name: git-gateway
  repo: gumivision/gumidreamchurch
  branch: main

# [수정] 정적 파일 전용 폴더인 public/images 로 변경하고, public_folder에 '/' 추가
media_folder: "public/images"
public_folder: "/images"

collections:
  # 1. 기존 게시판 글
  - name: "posts"
    label: "게시판 글"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작성일자", name: "date", widget: "datetime" }
      - { label: "대표/첨부 이미지", name: "image", widget: "image", required: false }
      - { label: "내용", name: "body", widget: "markdown" }

    # 2. 함께한 순간들 (갤러리) - 게시물 1개당 사진 1개 관리
  - name: "gallery"
    label: "함께한 순간들 (갤러리)"
    folder: "public/images"  # CMS에서 업로드 시 public/images 폴더로 바로 저장되도록 설정
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "사진 제목", name: "title", widget: "string" }
      - { label: "사진", name: "image", widget: "image" }

